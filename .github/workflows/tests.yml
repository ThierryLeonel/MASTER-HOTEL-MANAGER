name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Real MySQL, not SQLite — this is the production target database and
    # the whole point of this job is to catch anything a SQLite-only run
    # would miss (spec: MySQL/MariaDB is the only supported production DB).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: hms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, libxml, pdo, pdo_mysql, bcmath, gd, tokenizer, xml, ctype, json, fileinfo
          coverage: none

      - name: Validate composer.json/composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Composer security audit
        run: composer audit
        continue-on-error: false

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Point env at the MySQL service
        run: |
          php -r '
            $env = file_get_contents(".env");
            $env = preg_replace("/^DB_CONNECTION=.*/m", "DB_CONNECTION=mysql", $env);
            $env = preg_replace("/^DB_HOST=.*/m", "DB_HOST=127.0.0.1", $env);
            $env = preg_replace("/^DB_PORT=.*/m", "DB_PORT=3306", $env);
            $env = preg_replace("/^DB_DATABASE=.*/m", "DB_DATABASE=hms_test", $env);
            $env = preg_replace("/^DB_USERNAME=.*/m", "DB_USERNAME=root", $env);
            $env = preg_replace("/^DB_PASSWORD=.*/m", "DB_PASSWORD=", $env);
            file_put_contents(".env", $env);
          '

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 2
          done

      - name: Run migrations against real MySQL
        run: php artisan migrate --force

      - name: Seed the test database
        run: php artisan db:seed --force

      - name: Run the automated test suite (SQLite, fast default)
        run: php artisan test

      - name: Re-run the automated test suite against real MySQL
        run: php artisan config:clear && php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hms_test
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Build a deployment package (vendor included, dev files excluded)
        if: github.ref == 'refs/heads/main'
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction
          tar -czf hms-deployment-package.tar.gz \
            app bootstrap config database public resources routes \
            artisan composer.json composer.lock vendor .env.example

      - name: Upload deployment package artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hms-deployment-package
          path: hms-deployment-package.tar.gz
          retention-days: 14
